name: godot
description: .NET SDK + Godot (mono) editor, C# built and project imported. Sets $G.
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with: { dotnet-version: 8.0.x }
    - shell: bash
      run: |
        curl -sSfL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_mono_linux_x86_64.zip
        unzip -q g.zip -d $RUNNER_TEMP && rm g.zip
        echo "G=$RUNNER_TEMP/Godot_v${GODOT}-stable_mono_linux_x86_64/Godot_v${GODOT}-stable_mono_linux.x86_64" >> $GITHUB_ENV
    - uses: actions/cache@v4
      with:
        path: assets/cc0
        key: cc0-${{ hashFiles('tools/fetch_assets.py') }}
    - shell: bash
      run: for i in 1 2 3; do python3 tools/fetch_assets.py && break; sleep 15; done
    - uses: actions/cache@v4
      with:
        path: .godot/imported
        key: import-${{ hashFiles('tools/fetch_assets.py', 'project.godot') }}
    - shell: bash
      run: dotnet build
    - shell: bash
      run: $G --headless --path . --import || true
