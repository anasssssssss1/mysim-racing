name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT: 4.7.2
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: Physics tests
        run: $G --headless --path . --fixed-fps 240 -- --test

  net:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: Host and client on one machine
        run: |
          $G --headless --path . -- --net-test=host > host.log 2>&1 &
          HOST=$!
          sleep 8
          $G --headless --path . -- --net-test=client > client.log 2>&1; C=$?
          wait $HOST; H=$?
          grep -h "NET TEST\|\[host\]\|\[client\]" host.log client.log
          exit $((C | H))

  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: Software Vulkan
        run: for i in 1 2 3; do sudo apt-get update -q && sudo apt-get install -yq xvfb mesa-vulkan-drivers libvulkan1 && break; sleep 20; done
      - name: Render shots
        run: xvfb-run -a -s "-screen 0 1920x1080x24" $G --path . --rendering-driver vulkan --resolution 1920x1080 -- --shots=$PWD/shots
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: shots/ }

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - uses: actions/cache@v4
        id: tpl
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT }}-mono
      - name: Export templates
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_mono_export_templates.tpz
          d=~/.local/share/godot/export_templates/${GODOT}.stable.mono; mkdir -p $d
          unzip -q t.tpz && mv templates/* $d/ && rm -rf t.tpz templates
      - name: Export Windows
        run: mkdir -p build/windows && $G --headless --path . --export-release "Windows" build/windows/MySimRacing.exe
      - uses: actions/upload-artifact@v4
        with: { name: MySimRacing-windows, path: build/windows/ }

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - uses: actions/cache@v4
        id: tpl
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT }}-mono
      - name: Export templates
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_mono_export_templates.tpz
          d=~/.local/share/godot/export_templates/${GODOT}.stable.mono; mkdir -p $d
          unzip -q t.tpz && mv templates/* $d/ && rm -rf t.tpz templates
      - name: Android SDK paths and debug keystore
        run: |
          keytool -genkeypair -keystore $RUNNER_TEMP/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/$f; done
      - name: Export Android (debug-signed APK)
        run: mkdir -p build/android && $G --headless --path . --export-debug "Android" build/android/MySimRacing.apk
      - uses: actions/upload-artifact@v4
        with: { name: MySimRacing-android, path: build/android/ }
